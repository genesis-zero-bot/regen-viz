name: Deploy Genesis Brain Visualizer

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/configure-pages@v4
      - uses: actions/deploy-pages@v4
