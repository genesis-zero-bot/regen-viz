name: Deploy Genesis Brain Visualizer

on:
  push:
    branches: [genesis-brain-pages]
    paths:
      - 'skills/artifacts/semantic-graph-viz/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying Genesis Brain Visualizer"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'skills/artifacts/semantic-graph-viz'
      - uses: actions/configure-pages@v4
      - uses: actions/deploy-pages@v4
